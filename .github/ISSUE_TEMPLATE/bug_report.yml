name: Bug report
description: Something does not work in-game
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Voogle Route version
      placeholder: "0.10.0"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Big Ambitions version
      placeholder: "EA 0.10"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: MelonLoader log excerpt
      description: From `MelonLoader/Latest.log` around the issue
  - type: checkboxes
    id: nexus
    attributes:
      label: Download source
      options:
        - label: I installed from Nexus Mods
        - label: I installed from GitHub Releases
