name: Bug report
description: Report a problem with Voogle Route (SDK / Steam Workshop)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: game_version
    attributes:
      label: Big Ambitions version
      options:
        - 1.0 beta
        - EA 0.11 Experimental (older release)
        - EA 0.10 (MelonLoader legacy — unsupported)
        - Other
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Voogle Route version
      description: From the Mods menu or GitHub release tag (e.g. 1.0.0)
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Subscribe on Workshop and enable in Mods
        2. Set a destination on Voogle Maps
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Player log path — %LocalLow%\Hovgaard Games\Big Ambitions\Player.log
