name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync VERSION, latest.json, and ModManifest
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $latest = Get-Content latest.json -Raw | ConvertFrom-Json
          if ($latest.version -ne $version) {
            throw "latest.json version '$($latest.version)' != VERSION '$version'"
          }
          if ($latest.gameVersion -ne "0.11") {
            throw "latest.json gameVersion must be '0.11' for SDK builds"
          }

          $manifestPath = "VoogleRoute/ModManifest.asset"
          if (-not (Test-Path $manifestPath)) {
            throw "Missing $manifestPath"
          }
          $manifest = Get-Content $manifestPath -Raw
          if ($manifest -notmatch "Version: $version") {
            throw "ModManifest.asset Version must be '$version' (found mismatch in $manifestPath)"
          }
          Write-Host "OK: Voogle Route v$version (game EA $($latest.gameVersion))"

      - name: Check CHANGELOG mentions version
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          if ((Get-Content CHANGELOG.md -Raw) -notmatch [regex]::Escape($ver)) {
            throw "CHANGELOG.md does not mention $ver"
          }

      - name: Check locale files
        shell: pwsh
        run: |
          $en = Get-Content VoogleRoute/Locales/en.json -Raw | ConvertFrom-Json
          $files = Get-ChildItem VoogleRoute/Locales/*.json
          if ($files.Count -lt 22) {
            throw "Expected 22 locale files, found $($files.Count)"
          }
          Write-Host "OK: $($files.Count) locale files, $($en.PSObject.Properties.Name.Count) keys in en.json"
