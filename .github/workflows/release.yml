name: Release

# Attach pre-built VoogleRoute.dll from releases/<version>/ when you push a tag.
# Build locally first: dotnet build VoogleRoute.csproj -c Release
# CI cannot compile without Big Ambitions Il2Cpp assemblies on the runner.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $version = $tag -replace '^v',''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          $dll = "releases/$version/VoogleRoute.dll"
          if (-not (Test-Path $dll)) {
            throw "Missing $dll — run 'dotnet build -c Release' locally and commit or upload the DLL before tagging."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/${{ steps.ver.outputs.version }}/VoogleRoute.dll
            latest.json
          generate_release_notes: true
