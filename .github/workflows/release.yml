name: Release

# Tag v* to publish a GitHub release with source manifest + Workshop copy.
# Built mod DLL is produced locally via the Big Ambitions SDK Mod Builder (Unity).
# Steam Workshop upload is done from the game editor / Steamworks — not in CI.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $version = $tag -replace '^v',''
          $expected = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $expected) {
            throw "Tag version '$version' != VERSION file '$expected'"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            releases/${{ steps.ver.outputs.version }}/short-description.txt
            releases/${{ steps.ver.outputs.version }}/full-description.md
          generate_release_notes: true
